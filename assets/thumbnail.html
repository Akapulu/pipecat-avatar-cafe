<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1280px;height:720px;overflow:hidden;background:radial-gradient(900px 600px at 80% 20%,#2a1d14,#0e0b09 70%);font-family:Inter;position:relative}
.shot{position:absolute;right:-40px;top:70px;width:820px;height:600px;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.08);transform:rotate(-2deg);
background:url(thumb-src.png) no-repeat;background-size:1640px auto;background-position:-760px -60px}
.txt{position:absolute;left:56px;top:150px;width:520px;color:#fff;font-weight:900;font-size:104px;line-height:.98;letter-spacing:-.03em;text-transform:uppercase}
.txt em{font-style:normal;background:#ffd23f;color:#111;padding:0 14px;display:inline-block;margin-top:10px;transform:rotate(-1.5deg)}
.order{position:absolute;right:30px;bottom:24px;width:430px;height:328px;border-radius:22px;overflow:hidden;transform:rotate(2deg);
box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 5px #ffd23f;background:url(thumb-src.png) no-repeat;background-size:1712px auto;background-position:-1146px -643px}
.tag{position:absolute;left:60px;top:84px;color:#f08a4b;font-weight:800;font-size:28px;letter-spacing:.04em}
</style></head><body>
<div class="shot"></div><div class="order"></div>
<div class="tag">PIPECAT + AI AVATAR</div>
<div class="txt">It took<br>my <em>order</em></div>
</body></html>
